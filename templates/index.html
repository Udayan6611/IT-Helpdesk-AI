<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h3 class="mb-0">IT Helpdesk Ticket Submission</h3>
            </div>
            <div class="card-body">
                <form action="/submit" method="POST">
                    <div class="mb-3">
                        <label for="complaint" class="form-label"><b>Describe your IT issue:</b></label>
                        <textarea class="form-control" id="complaint" name="complaint" rows="4" placeholder="Example: My MacBook won't connect to the office Wi-Fi..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit Ticket</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
