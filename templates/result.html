<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Submitted</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow border-success">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0">Ticket Successfully Processed</h3>
            </div>
            <div class="card-body">
                <h5 class="card-title">Here is what you submitted:</h5>
                <p class="card-text text-muted">"{{ complaint }}"</p>
                <hr>
                <h5 class="card-title mt-3">AI Triage Category:</h5>
                <!-- This prints the category the AI chose -->
                <h2 class="text-primary">{{ category }}</h2>
                <br>
                <a href="/" class="btn btn-outline-secondary">Submit Another Ticket</a>
            </div>
        </div>
    </div>
</body>
</html>
